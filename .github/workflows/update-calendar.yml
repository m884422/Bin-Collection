name: Refresh and publish bin calendar

on:
  push:
    branches:
      - main
      - master
  schedule:
    # GitHub cron is UTC. These two UTC times plus the London-time gate below
    # give one scheduled run at 00:10 Europe/London in both GMT and BST.
    - cron: "10 0 * * *"
    - cron: "10 23 * * *"

jobs:
  london_midnight_gate:
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.gate.outputs.should_update }}
    steps:
      - name: Select the 00:10 London run (pushes also publish automatically)
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          london_offset="$(TZ=Europe/London date +%z)"
          if [[ "$SCHEDULE_CRON" == "10 0 * * *" && "$london_offset" == "+0000" ]] || \
             [[ "$SCHEDULE_CRON" == "10 23 * * *" && "$london_offset" == "+0100" ]]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "This is the 00:10 Europe/London refresh."
          else
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the UTC schedule that is not midnight in London."
          fi

  build_and_deploy:
    needs: london_midnight_gate
    if: needs.london_midnight_gate.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch live dates and build iCal feed
        env:
          MCC_UPRN: ${{ secrets.MCC_UPRN }}
        run: python generate_calendar.py --output site/bin-collections.ics

      - name: Save the refreshed feed to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bin-collections.ics
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Manchester bin calendar"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
